name: Recapture four MirType Inflearn sources

on:
  push:
    tags:
      - inflearn-mirtype-ko-recapture-20261128

permissions:
  contents: read

concurrency:
  group: inflearn-collector-all
  cancel-in-progress: false

jobs:
  recapture:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the recapture guard
        run: go test -mod=mod ./internal/inflearn -run '^TestCanonicalKorean'

      - name: Recapture and verify the four source keys
        env:
          STATE_BACKEND: clickhouse
          INGEST_MODE: clickhouse
          CH_HOST: ${{ secrets.CH_HOST || secrets.CLICKHOUSE_HOST }}
          CH_PORT: ${{ secrets.CH_PORT || secrets.CLICKHOUSE_PORT }}
          CH_USER: ${{ secrets.CH_USER || secrets.CLICKHOUSE_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD || secrets.CLICKHOUSE_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE || secrets.CLICKHOUSE_SECURE || 'false' }}
          CH_CLUSTER: statground_cluster
          CH_RAW_DATABASE: Data_Lecture_Inflearn_Raw
          CH_SERVICE_DATABASE: Data_Lecture_Inflearn_Service
          CH_LOG_DATABASE: Data_Lecture_Inflearn_Log
          CH_INSERT_DISTRIBUTED_SYNC: "true"
          CH_DIRECT_REPLICA_FALLBACK: "false"
          CH_DIRECT_OUTBOX_FALLBACK: "false"
          CH_INSERT_TIMEOUT_SECONDS: "60"
          INFLEARN_LECTURE_GENERATION_PUBLICATION_ENABLED: ${{ vars.INFLEARN_LECTURE_GENERATION_PUBLICATION_ENABLED || 'false' }}
          LECTURE_PROVIDER: inflearn
          PRODUCER_SOURCE: github_actions
          PRODUCER_IP: "::"
          INFLEARN_COURSE_URLS: |-
            https://www.inflearn.com/course/%EC%A4%91%EA%B5%AD%EC%96%B4-%EB%A7%90%ED%95%98%EA%B8%B0-%ED%9A%8C%ED%99%94?cid=325979
            https://www.inflearn.com/course/%ED%95%98%EB%A3%A8-10%EB%B6%84-%EB%87%8C%EC%9A%B4%EB%8F%99-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8-%EB%8F%85%EC%9D%BC%EC%96%B4?cid=339793
            https://www.inflearn.com/course/%EC%88%8F%EA%B3%B5-%ED%95%9C%EA%B8%80%EB%A1%9C-%EC%8B%9C%EC%9E%91%ED%95%98%EB%8A%94-%EC%A4%91%EA%B5%AD%EC%96%B4?cid=339888
            https://www.inflearn.com/course/%EC%A4%91%EA%B5%AD%EC%96%B4-%ED%95%99%EC%8A%B5%EC%9D%98-%EA%BD%83-%EC%8B%9C%EC%82%AC-%EA%B0%95%EB%8F%85?cid=340366
        run: |
          test -n "$CH_HOST" && test -n "$CH_USER" && test -n "$CH_PASSWORD"
          go run -mod=mod ./cmd/inflearn-collect-urls --canonical-ko-recapture
